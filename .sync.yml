---
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
.rubocop.yml:
  include_todos: true
  # cop settings the module set by hand (MODULES-11997 pdk update)
  cop_overrides:
    Style/HashSyntax:
      Enabled: false
Rakefile:
  changelog_max_issues: 500
  extra_disabled_lint_checks:
    - anchor_resource
    - strict_indent
    - params_not_optional_with_undef
    - exec_idempotency
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
    - '--collection-platform-exclude 9:ubuntu-18.04'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/nightly.yml:
  unmanaged: true
  cron: '35 4 * * *'
  acceptance_flags:
    - '--nightly'
    - '--collection-platform-exclude 9:ubuntu-18.04'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
Gemfile:
  overrides:
    - gem: 'puppet_litmus'
      version: '~> 2.8'
