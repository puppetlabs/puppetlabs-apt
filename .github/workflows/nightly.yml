name: "nightly"

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

jobs:
  Spec:
    # Forks lack the secrets needed to pass
    if: github.event_name != 'schedule' || github.repository_owner == 'puppetlabs'
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    with:
      additional_packages: "libcurl4-openssl-dev"
      ruby_version: "3.2"
    secrets: "inherit"

  Acceptance:
    needs: Spec
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    with:
      flags: '--nightly --collection-platform-exclude 9:ubuntu-18.04 --collection-platform-exclude 9:ubuntu-20.04'
      ruby_version: "3.2"
    secrets: "inherit"

